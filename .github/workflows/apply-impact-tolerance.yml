name: Apply impact fit tolerances

on:
  push:
    paths:
      - .github/workflows/apply-impact-tolerance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch impact fit options
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text()
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {n}")
              path.write_text(text.replace(old, new, 1))

          p = Path('NIsoMuon/limit_workflow.py')
          replace_once(
              p,
              '''        common = [
            "combineTool.py", "-M", "Impacts", "-d", str(workspace),
            "-m", format_mass_for_combine(mass),
            "--robustFit", "1",
            "--cminDefaultMinimizerStrategy", "1",
            "--setParameters", "r=0",
''',
              '''        common = [
            "combineTool.py", "-M", "Impacts", "-d", str(workspace),
            "-m", format_mass_for_combine(mass),
            "--robustFit", "1",
            "--setCrossingTolerance", "1e-8",
            "--cminDefaultMinimizerStrategy", "1",
            "--cminDefaultMinimizerTolerance", "1e-4",
            "--setRobustFitStrategy", "1",
            "--setRobustFitTolerance", "1e-4",
            "--setParameters", "r=0",
''',
              'limit_workflow impact tolerances',
          )

          p = Path('NIsoMuon/combine_review.py')
          replace_once(
              p,
              '''    common = [
        "combineTool.py",
        "-M",
        "Impacts",
        "-d",
        str(workspace),
        "-m",
        mass_for_combine(args.mass),
        "--robustFit",
        "1",
        "--setParameters",
''',
              '''    common = [
        "combineTool.py",
        "-M",
        "Impacts",
        "-d",
        str(workspace),
        "-m",
        mass_for_combine(args.mass),
        "--robustFit",
        "1",
        "--setCrossingTolerance",
        "1e-8",
        "--cminDefaultMinimizerStrategy",
        "1",
        "--cminDefaultMinimizerTolerance",
        "1e-4",
        "--setRobustFitStrategy",
        "1",
        "--setRobustFitTolerance",
        "1e-4",
        "--setParameters",
''',
              'combine_review S+B impact tolerances',
          )
          PY

          python3 -m py_compile NIsoMuon/limit_workflow.py NIsoMuon/combine_review.py

          git config user.name "Joon-Bin Lee"
          git config user.email "joon.bin.lee@cern.ch"
          git add NIsoMuon/limit_workflow.py NIsoMuon/combine_review.py
          git rm .github/workflows/apply-impact-tolerance.yml
          git commit -m "Tighten robust-fit tolerances for impact validation"
          git push origin HEAD:main
