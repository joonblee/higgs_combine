name: Temporary nuisance-name refinement

on:
  push:
    paths:
      - .github/workflows/tmp_refine_nuisance_names.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine standard Run-level nuisance names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NIsoMuon/limit_workflow.py')
          s = p.read_text()
          old_pu = '    if local == "pu":\n        return f"CMS_NPS26009_pileup_{run_group(year)}"\n'
          new_pu = '    if local == "pu":\n        energy = "13TeV" if year in RUN2_ERAS else "13p6TeV"\n        return f"CMS_pileup_{energy}"\n'
          old_scale = '    if local == "mu_scale":\n        return f"CMS_NPS26009_scale_m_{run_group(year)}"\n'
          new_scale = '    if local == "mu_scale":\n        energy = "13TeV" if year in RUN2_ERAS else "13p6TeV"\n        return f"CMS_scale_m_{energy}"\n'
          if s.count(old_pu) != 1 or s.count(old_scale) != 1:
              raise SystemExit('Expected PU/muon-scale blocks exactly once')
          s = s.replace(old_pu, new_pu, 1).replace(old_scale, new_scale, 1)
          p.write_text(s)
          PY
          python3 -m py_compile NIsoMuon/limit_workflow.py
          git diff --check
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NIsoMuon/limit_workflow.py
          git commit -m "Use standard Run-level pileup and muon-scale names"
          git push origin HEAD:main
