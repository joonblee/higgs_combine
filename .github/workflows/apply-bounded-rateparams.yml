name: Apply bounded rate parameter update

"on":
  push:
    paths:
      - ".github/workflows/apply-bounded-rateparams.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply_bounded_rateparams.py
      - name: Static checks
        run: |
          python3 -m py_compile NIsoMuon/limit_workflow.py NIsoMuon/combine_review.py
          git diff --check
          grep -n "param 0 1 \[0,10\]" NIsoMuon/limit_workflow.py
          grep -n "nominal_scaled = nominal_qcd / sigma_card" NIsoMuon/limit_workflow.py
          grep -n -- "--force" NIsoMuon/review.sh
      - name: Commit changes
        run: |
          git config user.name "Joon-Bin Lee"
          git config user.email "joon.bin.lee@cern.ch"
          git add NIsoMuon/limit_workflow.py NIsoMuon/systematics_NPS26009.yml NIsoMuon/combine_review.py NIsoMuon/review.sh
          git rm .github/scripts/apply_bounded_rateparams.py .github/workflows/apply-bounded-rateparams.yml
          git commit -m "Stabilize bounded Gaussian rate parameters"
          git push origin HEAD:main
