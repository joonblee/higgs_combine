name: Apply bounded rate-parameter update

on:
  push:
    paths:
      - .github/workflows/apply-bounded-rateparams.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {n}")
              return text.replace(old, new, 1)

          path = Path("NIsoMuon/limit_workflow.py")
          text = path.read_text()

          old = '''    columns: List[Tuple[int, str]] = [
              (ich, process) for ich in range(len(channels)) for process in PROCESSES
          ]

          def card_rate(ich: int, process: str) -> float:
'''
          new = '''    columns: List[Tuple[int, str]] = [
              (ich, process) for ich in range(len(channels)) for process in PROCESSES
          ]

          def qcd_additive_sigma_card(channel: ChannelResult) -> float:
              """Return the absolute QCD-shape width used to scale its rateParam.

              The physical QCD yield is represented as sigma * theta, with theta
              of order unity.  This avoids fitting tiny absolute-yield parameters
              directly while preserving the original Gaussian likelihood.
              """
              sigma_down = channel.qcd_shape_sigma_down
              sigma_up = channel.qcd_shape_sigma_up
              if sigma_down is None or sigma_up is None:
                  raise WorkflowError(
                      f"{channel.year}: missing QCD additive-shape uncertainty."
                  )

              nominal_qcd = channel.raw_rates["QCD"]
              width_scale = max(
                  nominal_qcd,
                  sigma_down,
                  sigma_up,
                  args.rate_floor,
              )
              width_floor = max(args.rate_floor, 1.0e-12 * width_scale)
              return max(sigma_down, sigma_up, width_floor)

          def card_rate(ich: int, process: str) -> float:
'''
          text = replace_once(text, old, new, "insert QCD scaling helper")

          old = '''        if (
              args.qcd_method == "data-driven"
              and process == "QCD"
              and channel.qcd_shape_sigma_down is not None
              and channel.qcd_shape_sigma_up is not None
          ):
              # The constrained rateParam below is the absolute QCD yield, so the
              # base process rate must be unity.
              return 1.0
          if args.dy_method == "data-driven" and process == "DY":
              source_yield = channel.dy_lightjet_yield or 0.0
              source_error = channel.dy_lightjet_error or 0.0
              nf = channel.dy_nf_amc or 0.0
              if source_yield == 0.0 and source_error > 0.0 and nf > 0.0:
                  # The zero-source LightJetStat rateParam below is the absolute DY
                  # yield, so the base process rate must be unity.
                  return 1.0
              # Otherwise the constrained NF rateParam multiplies the pre-NF source.
              return max(source_yield, args.rate_floor)
'''
          new = '''        if (
              args.qcd_method == "data-driven"
              and process == "QCD"
              and channel.qcd_shape_sigma_down is not None
              and channel.qcd_shape_sigma_up is not None
          ):
              # Use the absolute 1-sigma QCD-shape width as the base rate so the
              # constrained rateParam is dimensionless and O(1).
              return qcd_additive_sigma_card(channel)
          if args.dy_method == "data-driven" and process == "DY":
              source_yield = channel.dy_lightjet_yield or 0.0
              source_error = channel.dy_lightjet_error or 0.0
              nf = channel.dy_nf_amc or 0.0
              if source_yield == 0.0 and source_error > 0.0 and nf > 0.0:
                  # For a zero-source DY prediction, use the absolute 1-sigma
                  # LightJetStat width as the base rate.  The rateParam below is
                  # then a non-negative dimensionless O(1) parameter.
                  sigma = abs(nf) * source_error
                  if sigma <= 0.0 or not math.isfinite(sigma):
                      raise WorkflowError(
                          f"{channel.year}: invalid zero-source DY LightJetStat width."
                      )
                  return sigma
              # Otherwise the constrained NF rateParam multiplies the pre-NF source.
              return max(source_yield, args.rate_floor)
'''
          text = replace_once(text, old, new, "scale QCD and zero-source DY base rates")

          text = replace_once(
              text,
              '        "# data-driven QCD: QCD_norm is lnN; QCD_shape is an additive absolute-yield Gaussian rateParam; no fitted-template QCD_stat",\n',
              '        "# data-driven QCD: QCD_norm is lnN; QCD_shape is a non-negative unit-scaled additive Gaussian rateParam; no fitted-template QCD_stat",\n',
              "QCD datacard comment",
          )
          text = replace_once(
              text,
              '        "# data-driven DY: light-jet data source x aMC NF; positive source: LightJetStat=lnN, NFStat=Gaussian rateParam, NFModel=lnN; zero source: LightJetStat=additive Gaussian, NFStat/NFModel disabled",\n',
              '        "# data-driven DY: light-jet data source x aMC NF; positive source: LightJetStat=lnN, NFStat=positive Gaussian rateParam, NFModel=lnN; zero source: LightJetStat=non-negative unit-scaled additive Gaussian, NFStat/NFModel disabled",\n',
              "DY datacard comment",
          )

          old = '''            lines.append(
                  f"{nuisance_name} param "
                  f"{format_number(nf)} {format_number(nf_error)}"
              )
'''
          new = '''            lines.append(
                  f"{nuisance_name} param "
                  f"{format_number(nf)} {format_number(nf_error)} "
                  f"[0,{format_number(upper)}]"
              )
'''
          text = replace_once(text, old, new, "bound DY NFStat Gaussian")

          old = '''    # Zero-source DY LightJetStat: absolute Gaussian uncertainty.  The DY
          # process has base rate=1 only for these channels, so this rateParam is the
          # absolute DY yield.  NFStat and NFModel are deliberately absent here.
          if args.dy_method == "data-driven":
              additive_dy_lines: List[str] = []
              for channel in channels:
                  source_yield = channel.dy_lightjet_yield or 0.0
                  source_error = channel.dy_lightjet_error or 0.0
                  nf = channel.dy_nf_amc or 0.0
                  if source_yield != 0.0 or source_error <= 0.0 or nf <= 0.0:
                      continue
                  sigma = abs(nf) * source_error
                  if sigma <= 0.0 or not math.isfinite(sigma):
                      continue
                  upper = max(10.0 * sigma, 1.0e-6)
                  nuisance_name = nuisance_global_name("DY_LightJetStat", channel.year)
                  bin_name = f"bin_{channel.year}"
                  additive_dy_lines.append(
                      f"{nuisance_name} rateParam {bin_name} DY 0 [0,{format_number(upper)}]"
                  )
                  additive_dy_lines.append(
                      f"{nuisance_name} param 0 {format_number(sigma)}"
                  )
              if additive_dy_lines:
                  lines.append("# Additive Gaussian DY LightJetStat for zero central source")
                  lines.extend(additive_dy_lines)
'''
          new = '''    # Zero-source DY LightJetStat: non-negative unit-scaled additive Gaussian.
          # The process base rate is sigma_events, so theta=1 corresponds to a
          # +1-sigma absolute DY yield.  NFStat and NFModel are absent because a
          # multiplicative variation of an exactly zero source remains zero.
          if args.dy_method == "data-driven":
              additive_dy_lines: List[str] = []
              for channel in channels:
                  source_yield = channel.dy_lightjet_yield or 0.0
                  source_error = channel.dy_lightjet_error or 0.0
                  nf = channel.dy_nf_amc or 0.0
                  if source_yield != 0.0 or source_error <= 0.0 or nf <= 0.0:
                      continue
                  sigma = abs(nf) * source_error
                  if sigma <= 0.0 or not math.isfinite(sigma):
                      continue
                  nuisance_name = nuisance_global_name("DY_LightJetStat", channel.year)
                  bin_name = f"bin_{channel.year}"
                  additive_dy_lines.append(
                      f"{nuisance_name} rateParam {bin_name} DY 0 [0,10]"
                  )
                  additive_dy_lines.append(
                      f"{nuisance_name} param 0 1 [0,10]"
                  )
              if additive_dy_lines:
                  lines.append("# Non-negative unit-scaled additive Gaussian DY LightJetStat for zero central source")
                  lines.extend(additive_dy_lines)
'''
          text = replace_once(text, old, new, "unit-scale zero-source DY")

          old = '''    # Additive QCD functional-form uncertainty.  The QCD process has base
          # rate=1 in these channels, so the rateParam value itself is the absolute
          # QCD event yield.  The same parameter receives a symmetric Gaussian
          # constraint with sigma=max(sigma_down,sigma_up), in event-yield units.
          if args.qcd_method == "data-driven":
              additive_lines: List[str] = []
              for channel in channels:
                  sigma_down = channel.qcd_shape_sigma_down
                  sigma_up = channel.qcd_shape_sigma_up
                  if sigma_down is None or sigma_up is None:
                      continue

                  nominal_qcd = channel.raw_rates["QCD"]
                  width_scale = max(
                      nominal_qcd,
                      sigma_down,
                      sigma_up,
                      args.rate_floor,
                  )
                  width_floor = max(args.rate_floor, 1.0e-12 * width_scale)
                  sigma_down_card = max(sigma_down, width_floor)
                  sigma_up_card = max(sigma_up, width_floor)
                  sigma_card = max(sigma_down_card, sigma_up_card)

                  upper_range = max(
                      nominal_qcd + QCD_ADDITIVE_RANGE_NSIGMA * sigma_card,
                      2.0 * nominal_qcd,
                      10.0 * args.rate_floor,
                  )
                  nuisance_name = nuisance_global_name("QCD_shape", channel.year)
                  bin_name = f"bin_{channel.year}"

                  additive_lines.append(
                      f"{nuisance_name} rateParam {bin_name} QCD "
                      f"{format_number(nominal_qcd)} "
                      f"[0,{format_number(upper_range)}]"
                  )
                  additive_lines.append(
                      f"{nuisance_name} param "
                      f"{format_number(nominal_qcd)} "
                      f"{format_number(sigma_card)}"
                  )

              if additive_lines:
                  lines.append("# Additive Gaussian QCD functional-form uncertainty")
                  lines.extend(additive_lines)
'''
          new = '''    # Additive QCD functional-form uncertainty.  Scale the absolute QCD
          # yield by sigma_card so the fitted rateParam is dimensionless with a
          # unit Gaussian width.  The lower bound enforces a non-negative QCD yield.
          if args.qcd_method == "data-driven":
              additive_lines: List[str] = []
              for channel in channels:
                  sigma_down = channel.qcd_shape_sigma_down
                  sigma_up = channel.qcd_shape_sigma_up
                  if sigma_down is None or sigma_up is None:
                      continue

                  nominal_qcd = channel.raw_rates["QCD"]
                  sigma_card = qcd_additive_sigma_card(channel)
                  upper_range = max(
                      nominal_qcd + QCD_ADDITIVE_RANGE_NSIGMA * sigma_card,
                      2.0 * nominal_qcd,
                      10.0 * args.rate_floor,
                  )
                  nominal_scaled = nominal_qcd / sigma_card
                  upper_scaled = upper_range / sigma_card
                  nuisance_name = nuisance_global_name("QCD_shape", channel.year)
                  bin_name = f"bin_{channel.year}"

                  additive_lines.append(
                      f"{nuisance_name} rateParam {bin_name} QCD "
                      f"{format_number(nominal_scaled)} "
                      f"[0,{format_number(upper_scaled)}]"
                  )
                  additive_lines.append(
                      f"{nuisance_name} param "
                      f"{format_number(nominal_scaled)} 1 "
                      f"[0,{format_number(upper_scaled)}]"
                  )

              if additive_lines:
                  lines.append("# Non-negative unit-scaled additive Gaussian QCD functional-form uncertainty")
                  lines.extend(additive_lines)
'''
          text = replace_once(text, old, new, "unit-scale QCD additive nuisance")
          path.write_text(text)

          path = Path("NIsoMuon/systematics_NPS26009.yml")
          text = path.read_text()
          text = replace_once(
              text,
              "  description: 'QCD functional-form uncertainty propagated as an additive Gaussian uncertainty on the absolute QCD yield, treated independently by data-taking era.'",
              "  description: 'QCD functional-form uncertainty implemented as a non-negative, unit-scaled Gaussian-constrained rate parameter for the absolute QCD yield, treated independently by data-taking era.'",
              "QCD dictionary description",
          )
          text = replace_once(
              text,
              "  description: 'Finite-statistics uncertainty of the light-jet control-region input to the data-driven Drell-Yan prediction, treated independently by data-taking era.'",
              "  description: 'Finite-statistics uncertainty of the light-jet control-region input to the data-driven Drell-Yan prediction, treated independently by data-taking era. For a zero control-source prediction it is implemented as a non-negative, unit-scaled additive Gaussian rate parameter.'",
              "DY LightJetStat dictionary description",
          )
          path.write_text(text)

          path = Path("NIsoMuon/combine_review.py")
          text = path.read_text()
          old = '''    plot_base = output / f"scan_{args.target}_M{mass_label(args.mass)}_Bonly"
              status = run_command(
                  [plotter, str(root_file), "--POI", "r", "-o", str(plot_base)],
                  output,
                  dry_run=args.dry_run,
                  log=output / f"scan_plot_M{mass_label(args.mass)}.log",
              )
              if status != 0:
                  raise RuntimeError("plot1DScan.py failed")
              print(f"[SAVED] {plot_base}.pdf")
'''
          new = '''    plot_base = f"scan_{args.target}_M{mass_label(args.mass)}_Bonly"
              status = run_command(
                  [plotter, str(root_file), "--POI", "r", "-o", plot_base],
                  output,
                  dry_run=args.dry_run,
                  log=output / f"scan_plot_M{mass_label(args.mass)}.log",
              )
              if status != 0:
                  raise RuntimeError("plot1DScan.py failed")
              print(f"[SAVED] {output / (plot_base + '.pdf')}")
'''
          text = replace_once(text, old, new, "use relative scan plot output basename")
          path.write_text(text)

          path = Path("NIsoMuon/review.sh")
          text = path.read_text()
          text = replace_once(
              text,
              "#   /data6/Users/joonblee/higgs_combine/NIsoMuon/combine_review.py\n",
              "#   /data6/Users/joonblee/higgs_combine/CMSSW_14_1_0_pre4/src/NIsoMuon/combine_review.py\n",
              "review.sh path comment",
          )
          old = '''python3 combine_review.py 20 \\
              --task bias \\
              --bias-toys 500 \\
              --bias-multipliers 0,1,2 \\
              --r-min -2 \\
              --r-max 100 \\
              > review_logs/bias_M20.log 2>&1 &
'''
          new = '''python3 combine_review.py 20 \\
              --task bias \\
              --bias-toys 500 \\
              --bias-multipliers 0,1,2 \\
              --r-min -2 \\
              --r-max 100 \\
              --force \\
              > review_logs/bias_M20.log 2>&1 &
'''
          text = replace_once(text, old, new, "force M20 bias regeneration")
          old = '''python3 combine_review.py 70 \\
              --task bias \\
              --bias-toys 500 \\
              --bias-multipliers 0,1,2 \\
              --r-min -2 \\
              --r-max 100 \\
              > review_logs/bias_M70.log 2>&1 &
'''
          new = '''python3 combine_review.py 70 \\
              --task bias \\
              --bias-toys 500 \\
              --bias-multipliers 0,1,2 \\
              --r-min -2 \\
              --r-max 100 \\
              --force \\
              > review_logs/bias_M70.log 2>&1 &
'''
          text = replace_once(text, old, new, "force M70 bias regeneration")
          path.write_text(text)
          PY

      - name: Static checks
        shell: bash
        run: |
          python3 -m py_compile NIsoMuon/limit_workflow.py NIsoMuon/combine_review.py
          git diff --check
          grep -n "LightJetStat.*param 0 1 \[0,10\]" NIsoMuon/limit_workflow.py
          grep -n "nominal_scaled.*sigma_card\|upper_scaled.*sigma_card" NIsoMuon/limit_workflow.py
          grep -n -- "--force" NIsoMuon/review.sh

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Joon-Bin Lee"
          git config user.email "joon.bin.lee@cern.ch"
          git add NIsoMuon/limit_workflow.py NIsoMuon/systematics_NPS26009.yml NIsoMuon/combine_review.py NIsoMuon/review.sh
          git rm .github/workflows/apply-bounded-rateparams.yml
          git commit -m "Stabilize bounded Gaussian rate parameters"
          git push origin HEAD:main
