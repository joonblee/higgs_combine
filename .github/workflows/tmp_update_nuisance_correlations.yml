name: Temporary nuisance-correlation update

on:
  push:
    paths:
      - .github/workflows/tmp_update_nuisance_correlations.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update NIsoMuon nuisance naming and correlations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("NIsoMuon/limit_workflow.py")
          lines = path.read_text().splitlines()
          start_marker = "    # BTV fixed-WP.  The official uncorrelated names can be used verbatim."
          end_marker = "    # The current L1 ECAL/muon prefiring nuisances are decorrelated between"
          if lines.count(start_marker) != 1 or lines.count(end_marker) != 1:
              raise SystemExit("Could not locate the nuisance naming block uniquely")
          start = lines.index(start_marker)
          end = lines.index(end_marker)
          new_block = [
              "    # BTV fixed-WP.  SKFlat/SKNano use the inclusive light-flavour",
              "    # calibration and the combined heavy-flavour calibration.  The POG-provided",
              "    # correlated components are shared within a Run, while the uncorrelated",
              "    # components remain independent for every data-taking era.",
              "    if local == \"btagSFbc_correlated\":",
              "        energy = \"13TeV\" if year in RUN2_ERAS else \"13p6TeV\"",
              "        return f\"CMS_NPS26009_btag_fixedWP_comb_bc_correlated_{energy}\"",
              "    if local == \"btagSFlight_correlated\":",
              "        energy = \"13TeV\" if year in RUN2_ERAS else \"13p6TeV\"",
              "        return f\"CMS_NPS26009_btag_fixedWP_incl_light_correlated_{energy}\"",
              "    if local == \"btagSFbc_uncorrelated\":",
              "        return f\"CMS_btag_fixedWP_comb_bc_uncorrelated_{year}\"",
              "    if local == \"btagSFlight_uncorrelated\":",
              "        return f\"CMS_btag_fixedWP_incl_light_uncorrelated_{year}\"",
              "",
              "    # Experimental correlation model.  Keep the era-specific Up/Down responses",
              "    # from the input histograms; only the nuisance identity determines the fit",
              "    # correlation.  Pileup, muon ID, and muon momentum scale/resolution are",
              "    # correlated across eras within Run 2 or within Run 3.  Muon trigger, JES,",
              "    # and JER remain decorrelated by era.  Run 2 and Run 3 are independent for",
              "    # the Run-correlated detector terms.",
              "    by_era_exp = {",
              "        \"jer\": \"CMS_res_j\",",
              "        \"jes\": \"CMS_scale_j\",",
              "    }",
              "    if local in by_era_exp:",
              "        return f\"{by_era_exp[local]}_{year}\"",
              "    if local == \"pu\":",
              "        return f\"CMS_NPS26009_pileup_{run_group(year)}\"",
              "    if local == \"mu_trig_sf\":",
              "        return f\"CMS_NPS26009_eff_m_trigger_{year}\"",
              "    if local == \"mu_id_sf\":",
              "        return f\"CMS_NPS26009_eff_m_id_{run_group(year)}\"",
              "    if local == \"mu_scale\":",
              "        return f\"CMS_NPS26009_scale_m_{run_group(year)}\"",
              "",
          ]
          lines[start:end] = new_block
          text = "\n".join(lines) + "\n"

          old_comment = "        \"# b tagging = BTV fixed-WP HF/LF x correlated/uncorrelated multi-era scheme (correlated within Run 2 or Run 3)\",\n"
          new_comment = (
              "        \"# experimental correlations = pileup/muon ID/muon scale by Run; muon trigger/JES/JER by era\",\n"
              "        \"# b tagging = BTV fixed-WP comb_bc/incl_light x correlated/uncorrelated multi-era scheme (correlated within Run 2 or Run 3)\",\n"
          )
          if text.count(old_comment) != 1:
              raise SystemExit("Could not locate the datacard b-tag comment uniquely")
          text = text.replace(old_comment, new_comment, 1)

          old_config = (
              "    print(\n"
              "        \"[CONFIG] btag=BTV fixed-WP; HF/LF separated; \"\n"
              "        \"corr shared within Run2 or within Run3 and independent between runs; \"\n"
              "        \"uncorr decorrelated by era\"\n"
              "    )\n"
          )
          new_config = (
              "    print(\n"
              "        \"[CONFIG] experimental correlations: PU/muon ID/muon scale by Run; \"\n"
              "        \"muon trigger/JES/JER by era\"\n"
              "    )\n"
              "    print(\n"
              "        \"[CONFIG] btag=BTV fixed-WP comb_bc/incl_light; HF/LF separated; \"\n"
              "        \"corr shared within Run2 or within Run3 and independent between runs; \"\n"
              "        \"uncorr decorrelated by era\"\n"
              "    )\n"
          )
          if text.count(old_config) != 1:
              raise SystemExit("Could not locate the b-tag configuration block uniquely")
          text = text.replace(old_config, new_config, 1)

          path.write_text(text)
          PY

          python3 -m py_compile NIsoMuon/limit_workflow.py
          git diff --check
          git diff -- NIsoMuon/limit_workflow.py

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NIsoMuon/limit_workflow.py
          git commit -m "Update experimental nuisance correlations"
          git push origin HEAD:main
